<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap css library -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Font Awesome 7.0.0 library -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    />
    <title>Traffic Monitoring</title>
  </head>
  <body>
    <!-- Logo -->
    <div class="bg-warning-subtle border">
      <div class="p-5 d-flex justify-content-between">
        <div class="d-flex gap-2 align-items-center">
          <i class="fa-solid fa-traffic-light text-dark h2 mb-0"></i>
          <h2 class="mb-0">Traffic Monitoring</h2>
        </div>
        <div class="d-flex gap-2 align-items-center">
          <i class="fa-solid fa-circle-dot text-success"></i>
          <h5 class="mb-0">Online</h5>
        </div>
      </div>
    </div>

    <!-- Showcase -->
    <div class="px-3 border-start border-end border-bottom">
      <div class="row">
        <div class="col-3 border-end">
          <div class="nav flex-column pt-4">
            <button
              class="nav-link active text-dark"
              data-bs-toggle="tab"
              data-bs-target="#dashboard"
            >
              Dashboard
            </button>
            <button
              class="nav-link text-dark"
              data-bs-toggle="tab"
              data-bs-target="#vehicles"
            >
              Vehicles
            </button>
            <button
              class="nav-link text-dark"
              data-bs-toggle="tab"
              data-bs-target="#streets"
            >
              Streets
            </button>
            <button
              class="nav-link text-dark"
              data-bs-toggle="tab"
              data-bs-target="#analytics"
            >
              Analytics
            </button>
            <button
              class="nav-link text-dark"
              data-bs-toggle="tab"
              data-bs-target="#settings"
            >
              Settings
            </button>
          </div>
        </div>
        <div class="col-9">
          <div class="tab-content p-4">
            <div id="dashboard" class="tab-pane fade show active">
              <!-- Dashboard content -->
              <div class="h3">Overview</div>
              <div class="row gap-2 align-items-start">
                <div class="col-sm-12 col-md-5 col-lg-2">
                  <div class="card text-center">
                    <div class="card-body">
                      <h4 id="vehicleCount" class="card-title">3409</h4>
                      <p class="cart-text">Monitored Vehicles</p>
                    </div>
                  </div>
                </div>
                <div class="col-sm-12 col-md-5 col-lg-2">
                  <div class="card text-center">
                    <div class="card-body">
                      <h4 id="vehicleType" class="card-title">3</h4>
                      <p class="cart-text">Types of Vehicles</p>
                    </div>
                  </div>
                </div>
                  <div class="card text-center col-sm-12 col-md-5 col-lg-2">
                    <div class="card-body">
                      <h4 id="streetName" class="card-title">75</h4>
                      <p class="cart-text">Streets</p>
                    </div>
                  </div>
                  <div class="card text-center col-sm-12 col-md-5 col-lg-2">
                    <div class="card-body">
                      <h4 id="congestionCount" class="card-title">669.890</h4>
                      <p class="cart-text">Congested Vehicle Records</p>
                    </div>
                  </div>
                  <div class="card text-center col-sm-12 col-md-5 col-lg-2">
                    <div class="card-body">
                      <h4 id="uncongestionCount" class="card-title">378.685</h4>
                      <p class="cart-text">Non-congested Vehicle Records</p>
                    </div>
                  </div>
                </div>
              </div>
              <div id="vehicles" class="tab-pane fade">Vehicles content</div>
              <div id="streets" class="tab-pane fade">Streets content</div>
              <div id="analytics" class="tab-pane fade">Analytics content</div>
              <div id="settings" class="tab-pane fade">Settings content</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Bootstrap JS 5.3 Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JS file -->
    <script src="/javascript/script.js"></script>
  </body>
</html>
